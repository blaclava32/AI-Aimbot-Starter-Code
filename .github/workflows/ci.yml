name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  first-party:
    name: First-party checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.0,<3" "colorama>=0.4.6" ruff

      - name: Ruff (first-party only)
        run: |
          python -m ruff check \
            main.py \
            example_bare \
            example_aimbot/__init__.py \
            example_aimbot/main.py \
            example_aimbot/gameSelection.py \
            example_aimbot/schema \
            tests

      - name: Compile first-party modules
        run: |
          python -m py_compile \
            main.py \
            example_bare/__init__.py \
            example_bare/main.py \
            example_bare/schema/__init__.py \
            example_bare/schema/settings.py \
            example_aimbot/__init__.py \
            example_aimbot/main.py \
            example_aimbot/schema/__init__.py \
            example_aimbot/schema/settings.py \
            example_aimbot/gameSelection.py \
            tests/test_settings.py

      - name: Unit tests (settings + harness helpers)
        run: python -m unittest discover -s tests -v
