# First-party lint only; vendored YOLOv5 trees are excluded from CI paths.
target-version = "py310"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501", # line length handled loosely for readability in starter code
]

[lint.per-file-ignores]
# Windows exposes the PATH variable as "Path"; keep both spellings in sync.
"main.py" = ["SIM112"]
